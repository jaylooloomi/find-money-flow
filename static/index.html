<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoneyTide 錢潮 · 台股產業熱力圖</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"
          integrity="sha512-XSmbX3mhrD2ix5fXPTRQb2FwK22sRMVQTpBP2ac8hX7Dh/605hA2QDegVWiAvZPiXIxOV0CbkmUjGionDpbCmw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <span class="logo" title="錢潮：看資金湧向哪個族群">MoneyTide 錢潮</span>
    <div class="seg mode" id="modeSwitch" role="group" aria-label="模式">
      <button data-mode="live">即時</button><button data-mode="history">歷史</button>
    </div>
    <div class="ctrls" id="liveControls">
    <div class="seg" data-group="market" role="group" aria-label="市場">
      <button data-value="all">全部</button><button data-value="上市">上市</button><button data-value="上櫃">上櫃</button>
    </div>
    <div class="seg" data-group="sizeBy" role="group" aria-label="格子大小">
      <button data-value="cap">大小：市值</button><button data-value="capped" title="依市值，但任一檔最多佔族群面積 15%（避免台積電蓋住整個族群）">市值上限</button><button data-value="turnover">成交值</button><button data-value="equal" title="每檔一樣大，只看顏色">等大小</button>
    </div>
    <div class="seg" data-group="colorBy" role="group" aria-label="顏色指標">
      <button data-value="today">顏色：今日</button><button data-value="week">本週</button>
    </div>
    <div class="seg" data-group="watchOnly" role="group" aria-label="範圍">
      <button data-value="false">全市場</button><button data-value="true">只看自選</button>
    </div>
    <label class="chk"><input type="checkbox" id="includeEtf"> 含 ETF</label>
    <span class="spacer"></span>
    <span class="status" id="status" title="">
      <i class="dot"></i><span id="statusText">載入中…</span>
    </span>
    <button class="icon" id="settingsBtn" title="更新頻率設定" aria-label="更新頻率設定">⚙</button>
    <button class="icon" id="refreshBtn" title="立即更新" aria-label="立即更新">⟳</button>
    <div class="popover" id="settings" hidden>
      <label>盤中更新頻率（秒，30–600）
        <input type="number" id="pollSeconds" min="30" max="600" step="1">
      </label>
      <div class="row"><button id="settingsSave" class="primary">儲存</button><button id="settingsCancel">取消</button></div>
      <p class="err" id="settingsErr"></p>
    </div>
    </div>
    <div class="ctrls" id="histControls" hidden>
      <div class="seg" id="hTabs" role="tablist" aria-label="分頁"><button data-tab="1" role="tab">分頁1</button><button data-tab="2" role="tab">分頁2</button><button data-tab="3" role="tab" title="盤後報告：N 找到的群組、動機判讀與跨天追蹤">盤後報告</button><button data-tab="4" role="tab" title="研究：台股 ETF 下跌中出現溢價後的報酬（research/etf_premium）">ETF 溢價研究</button></div>
      <button class="icon" id="hPrev" title="前一個交易日" aria-label="前一個交易日">◀</button>
      <input type="date" id="hDate" class="field" aria-label="日期">
      <button class="icon" id="hNext" title="下一個交易日" aria-label="下一個交易日">▶</button>
      <div class="seg" id="hGrouping" role="group" aria-label="族群分類">
        <button data-value="industry">官方產業</button><button data-value="custom">自訂族群</button><button data-value="concept" disabled title="概念股分類載入中…">概念股</button><button data-value="chain" disabled title="細產業分類載入中…">細產業</button><button data-value="news" disabled title="新聞族群整理中…">新聞族群</button><button data-value="group" disabled title="集團分類整理中…">集團</button>
      </div>
      <button class="icon wide" id="hManageGroups" title="建立與編輯自訂族群">管理族群</button>
      <label class="chk">強勢門檻 <input type="number" id="hThreshold" class="field num" min="1" max="10" step="0.5"> %</label>
      <span class="spacer"></span>
      <span class="status" id="hStatus"><i class="dot"></i><span id="hStatusText">載入中…</span></span>
    </div>
  </header>

  <main class="body" id="liveView">
    <section class="main">
      <nav class="crumb" id="crumb" aria-label="目前範圍"></nav>
      <div class="chart-wrap">
        <div id="chart"></div>
        <div id="empty" class="empty" hidden></div>
        <aside id="card" class="card" hidden aria-live="polite"></aside>
      </div>
      <div class="foot">
        <span class="legend"><span id="legendMin">-7%</span><span class="bar"></span><span id="legendMax">+7%</span></span>
        <span id="note" class="note"></span>
      </div>
    </section>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="industry">產業</button>
        <button role="tab" data-tab="watch">自選 <span id="watchCount">(0)</span></button>
      </div>
      <div class="table-wrap">
        <table id="matrix" class="grid">
          <thead><tr>
            <th data-sort="name" class="l">產業</th>
            <th data-sort="change_pct">今日</th>
            <th data-sort="week_pct">本週</th>
            <th data-sort="perf_20" title="近 20 個交易日（歷史收盤，等權日報酬連乘；不含今日盤中）">20日</th>
            <th data-sort="amplitude_pct">振幅</th>
            <th data-sort="turnover_share" title="成交值占目前篩選範圍的比例">量占比</th>
            <th data-sort="vol_ratio" title="今日產業成交值 ÷ 近 20 交易日日均（盤中依已開盤時間比例換算）">量能</th>
            <th data-sort="strong_ratio" title="漲幅 ≥ 5% 的家數 ÷ 有漲跌幅的家數（官方產業只算普通股）">≥5%</th>
            <th data-sort="limit_ratio" title="漲停（≥ 9.5%）家數 ÷ 有漲跌幅的家數（官方產業只算普通股）">漲停%</th>
            <th data-sort="z20" title="成交比重 Z（20 日）：今天佔全市場成交值的比重，比前 20 個交易日平均高出幾個標準差；≥ 2 標示 🔥">比重Z</th>
            <th data-sort="mf" title="價量資金流：Σ(收盤位置 × 成交值) ÷ 成交值，−100～+100；收在高檔＝買盤推升，爆量收低＝倒貨">資金流</th>
            <th data-sort="turnover_rate" title="週轉率：成交股數 ÷ 發行股數">週轉率</th>
            <th data-sort="breadth" title="上漲家數 / 下跌家數（依漲減跌排序）">漲/跌</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <table id="watch" class="grid" hidden>
          <thead><tr>
            <th data-sort="code" class="l">代號</th>
            <th data-sort="name" class="l">名稱</th>
            <th data-sort="price">價格</th>
            <th data-sort="change_pct">漲跌幅</th>
            <th data-sort="week_pct">本週</th>
            <th data-sort="turnover_100m">成交值</th>
            <th aria-label="移除"></th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <p id="watchEmpty" class="hint" hidden>尚無自選股。點熱力圖上的個股，在資訊卡中按「加入自選」。</p>
      </div>
    </aside>
  </main>

  <main class="hist-tab2" id="historyTab2" hidden></main><!-- 分頁2: N · 資金連動搜尋 (finder.js) -->
  <main class="hist-tab2" id="historyTab3" hidden></main><!-- 分頁3: 盤後報告 (report.js) -->
  <main class="hist-tab2" id="historyTab4" hidden></main><!-- 分頁4: ETF 溢價研究 (etfstudy.js) -->

  <main class="hist" id="historyView" hidden>
    <section class="panel hA">
      <div class="panel-h"><b>A · 當日熱力圖</b><span class="crumb" id="hCrumb"></span>
        <span class="spacer"></span>
        <div class="seg" data-hgroup="sizeBy"><button data-value="cap">市值</button><button data-value="capped" title="依市值，但任一檔最多佔族群面積 15%（避免台積電蓋住整個族群）">市值上限</button><button data-value="turnover">成交值</button><button data-value="equal" title="每檔一樣大，只看顏色">等大小</button></div>
      </div>
      <div class="chart-wrap"><div id="hChart"></div><div id="hEmpty" class="empty" hidden></div></div>
    </section>
    <section class="panel hB">
      <div class="panel-h"><b>B · 強勢族群排行</b><span class="muted" id="hBDate"></span></div>
      <div class="table-wrap">
        <table id="hGroups" class="grid">
          <thead><tr>
            <th data-sort="name" class="l">族群</th>
            <th data-sort="rank" title="依平均漲幅排名（點一下由第 1 名排起）；▲▼ 是與前一交易日相比的名次變化">名次</th>
            <th data-sort="count">家數</th>
            <th data-sort="avg_pct" title="等權平均漲幅">平均漲幅</th>
            <th data-sort="avg_amp" title="成分股振幅（最高 − 最低）÷ 昨收 的等權平均：族群當天震盪多大">平均振幅</th>
            <th data-sort="cap_pct" title="昨收市值加權">市值加權</th>
            <th data-sort="perf_5" title="近 5 個交易日（等權日報酬連乘）">5日</th>
            <th data-sort="perf_20" title="近 20 個交易日">20日</th>
            <th data-sort="perf_60" title="近 60 個交易日">60日</th>
            <th data-sort="strong_ratio" id="hStrongTh">≥5%佔比</th>
            <th data-sort="limit_up">漲停</th>
            <th data-sort="limit_ratio" title="漲停（≥ 9.5%）家數 ÷ 有漲跌幅的家數">漲停%</th>
            <th data-sort="breadth" title="上漲家數 / 下跌家數">漲/跌</th>
            <th data-sort="z20" title="成交比重 Z（20 日）：族群佔全市場成交值的比重，比前 20 個交易日平均高出幾個標準差；≥ 2 標示 🔥 點火">比重Z</th>
            <th data-sort="mf" title="價量資金流：Σ(收盤位置 × 成交值) ÷ 成交值，−100～+100；收在高檔＝買盤推升，爆量收低＝倒貨">資金流</th>
            <th data-sort="turnover_rate" title="週轉率：成交股數 ÷ 發行股數">週轉率</th>
            <th data-sort="inst_net" title="三大法人買賣超金額（億元，股數 × 收盤價）；滑過看佔族群市值比">法人</th>
            <th data-sort="r20" title="連動 R：市值前 8 大成分股過去 20 日漲跌幅的兩兩相關平均；&gt; 0.7 群體圍攻、&lt; 0.3 單兵作戰（點族群看 K 面板）">連動R</th>
            <th data-sort="leader_pct" class="l" title="族群內當日漲幅最大的個股（點擊看個股卡片）">領漲股</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <section class="panel hC">
      <div class="panel-h"><b>C · 族群輪動</b>
        <div class="seg" data-hgroup="rotDays"><button data-value="10">10 日</button><button data-value="20">20 日</button><button data-value="60">60 日</button></div>
        <div class="seg" data-hgroup="rotMetric">
          <button data-value="strong_ratio">強勢佔比</button><button data-value="avg_pct">平均漲幅</button><button data-value="breadth">上漲家數比</button><button data-value="limit_up">漲停數</button><button data-value="share_z" title="每天的成交比重 Z（20 日），看資金連續流入哪個族群">比重Z</button>
        </div>
        <button type="button" class="icon info-i" id="hRotInfoBtn" title="這些數字是什麼意思？" aria-label="指標說明" aria-expanded="false">i</button>
        <span class="muted">點格子切換日期</span>
      </div>
      <div class="rot-info" id="hRotInfo" hidden></div>
      <div class="table-wrap rot-wrap"><table id="hRotation" class="rot"></table></div>
    </section>
    <section class="panel hD">
      <div class="panel-h"><b>D · 集體上漲</b>
        <div class="seg" data-hgroup="moverMode"><button data-value="day">當日漲幅</button><button data-value="range">區間累計</button><button data-value="streak">連續上漲</button></div>
        <label class="chk" id="hFromWrap">從 <input type="date" id="hFrom" class="field"></label>
        <label class="chk">≥ <input type="number" id="hMoverValue" class="field num" min="1" step="1"> <span id="hMoverUnit">%</span></label>
        <span class="muted" id="hMoverSummary"></span>
      </div>
      <div class="movers" id="hMovers"></div>
    </section>
  </main>
  <div class="popover groups-panel" id="groupPanel" hidden role="dialog" aria-label="自訂族群">
    <div class="gp-head"><b>自訂族群</b><button class="icon" id="gpClose" aria-label="關閉">✕</button></div>
    <div class="gp-new"><input class="field" id="gpNewName" maxlength="30" placeholder="新族群名稱，例如：散熱"><button class="primary" id="gpCreate">建立</button></div>
    <div class="gp-body">
      <ul class="gp-list" id="gpList"></ul>
      <div class="gp-detail" id="gpDetail"></div>
    </div>
    <datalist id="gpStockList"></datalist>
    <p class="err" id="gpErr"></p>
  </div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
